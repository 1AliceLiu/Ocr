<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <title>登录 · OSD 检测结果</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='24' font-weight='700' text-anchor='middle' fill='white'%3EOSD%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #172033;
      --muted: #728097;
      --line: #dfe7f2;
      --accent: #2563eb;
      --danger: #b4232d;
      --sans: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
              "Noto Sans CJK SC", system-ui, -apple-system, BlinkMacSystemFont,
              "Segoe UI", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 28px 18px;
      color: var(--ink);
      background:
        radial-gradient(900px 600px at 10% -10%, rgba(37, 99, 235, 0.14), transparent 60%),
        radial-gradient(760px 500px at 100% 0%, rgba(8, 145, 178, 0.1), transparent 55%),
        linear-gradient(180deg, #f8faff, #eef3fa);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .login-card {
      width: min(420px, 100%);
      padding: 30px 28px 26px;
      border: 1px solid rgba(220, 228, 239, 0.98);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 60px rgba(23, 32, 51, 0.12);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 26px;
    }

    .brand-mark {
      display: grid;
      width: 50px;
      height: 50px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.24), transparent 46%),
        linear-gradient(135deg, #2563eb, #0e7490);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.24);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 760;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin: 0 0 7px 2px;
      color: #3b4a61;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: 0;
      color: var(--ink);
      background: #fbfcfe;
      font-family: var(--sans);
      font-size: 14px;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:focus {
      border-color: rgba(37, 99, 235, 0.7);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.11);
    }

    button {
      display: flex;
      width: 100%;
      height: 45px;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #0e7490);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.22);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 26px rgba(37, 99, 235, 0.28);
    }

    button:active {
      transform: translateY(0);
    }

    .error {
      margin: 0 0 15px;
      padding: 10px 12px;
      border: 1px solid #fecdd3;
      border-radius: 10px;
      color: var(--danger);
      background: #fff1f2;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .footnote {
      margin: 20px 0 0;
      color: #8c99ab;
      font-size: 11.5px;
      line-height: 1.55;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 25px 20px 22px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">OSD</div>
      <div>
        <h1>OSD 检测结果</h1>
        <p class="subtitle">请输入访问账号后查看检测结果</p>
      </div>
    </div>

    {{ERROR}}

    <form method="post" action="/login">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" required
               autocomplete="username" autofocus spellcheck="false">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password">
      </div>
      <button type="submit">登录</button>
    </form>

    <p class="footnote">仅用于 OSD 检测结果展示 · 请勿公开分享账号</p>
  </main>
</body>
</html>
